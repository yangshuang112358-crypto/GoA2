function resetTo(t){seeking=true;sound.stop();coinHover='';nodes=[];oldNodes=[];fired.clear();chapter=-1;time=0;scroll=scrollGoal=0;zoom=zoomGoal=1;sparks=[];finished=false;epoch++;const milestones=[...CHAPTERS.map((c,i)=>({t:c.at,scene:i})),...actions.map((a,i)=>({t:a[0],action:i}))].sort((a,b)=>a.t-b.t);for(const m of milestones){if(m.t>t)break;time=m.t;if(m.scene!==undefined)scene(m.scene);else{actions[m.action][1]();fired.add(m.action);}}time=t;seeking=false;playing=true;last=performance.now();document.querySelector('#play').textContent='暂停';}
