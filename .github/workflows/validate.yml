name: Validate content and core
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate sources, content and documentation
        run: python -B tools/validate.py
      - name: Validate migration guardrails
        run: python -B -m unittest discover -s tests -v
      - name: Check tracked whitespace
        run: git diff --check
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build and test shared CSharp core
        run: ./tools/test-core.ps1
        shell: pwsh
      - name: Stage verified Unity content
        run: python -B tools/prepare_unity.py
