name: Build EasyTier userspace transport
on:
  push:
    branches: [experiment/ai-level-20260920]
    paths: [.github/workflows/easytier-userspace.yml, tools/build_easytier_userspace.py]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned source and minimal patch
        run: python tools/build_easytier_userspace.py artifacts/easytier-build
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Build without capture and TUN features
        working-directory: artifacts/easytier-build/EasyTier-2.6.4
        run: cargo +1.95.0 build --release --locked -p easytier --bin easytier-core --no-default-features --features smoltcp,socks5,aes-gcm
      - name: Verify executable runs without Packet DLL
        shell: pwsh
        run: |
          New-Item -ItemType Directory artifacts/easytier-build/check
          Copy-Item artifacts/easytier-build/EasyTier-2.6.4/target/release/easytier-core.exe artifacts/easytier-build/check/
          & artifacts/easytier-build/check/easytier-core.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'The transport still requires an external runtime or Packet.dll' }
      - uses: actions/upload-artifact@v4
        with:
          name: Goa2-EasyTier-userspace-2.6.4
          path: |
            artifacts/easytier-build/check/easytier-core.exe
            artifacts/easytier-build/Goa2-EasyTier-2.6.4-modified-source.zip
          retention-days: 30
